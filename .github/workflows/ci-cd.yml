name: Seamount CI/CD

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]

jobs:
  build-test-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend deps
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Install frontend deps
        run: |
          cd frontend
          npm ci

      - name: Run backend lint (optional)
        run: |
          pip install flake8
          flake8 backend || true

      - name: Run frontend lint (optional)
        run: |
          cd frontend
          npm run lint || true

      - name: Run backend tests (optional)
        run: |
          cd backend
          pytest -q || true

      - name: Start backend for smoke tests
        run: |
          nohup python -m uvicorn backend.api.main:app --host 0.0.0.0 --port 8000 > backend_smoke.log 2>&1 &
          sleep 6

      - name: Run smoke tests
        run: |
          bash tools/curl_test_suite.sh

      - name: Trigger Render deploy (production)
        if: github.ref == 'refs/heads/main'
        env:
          RENDER_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL_PROD }}
        run: |
          curl -X POST "$RENDER_HOOK"

      - name: Trigger Render deploy (staging)
        if: github.ref == 'refs/heads/dev'
        env:
          RENDER_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL_STAGING }}
        run: |
          curl -X POST "$RENDER_HOOK"

      - name: Trigger Vercel deploy (production)
        if: github.ref == 'refs/heads/main'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          # deploy via Vercel API (Project ID or Name)
          curl -s -X POST "https://api.vercel.com/v13/deployments" \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"name\":\"seamount-io\",\"target\":\"production\"}" || true

      - name: Trigger Vercel deploy (staging previews)
        if: github.ref == 'refs/heads/dev'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          curl -s -X POST "https://api.vercel.com/v13/deployments" \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"name\":\"seamount-io\",\"target\":\"preview\"}" || true
