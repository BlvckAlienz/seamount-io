name: Keep Render Services Warm

# This workflow runs on a schedule and can also be triggered manually
on:
  schedule:
    # Cron syntax: minute hour day month weekday
    # */10 means "every 10 minutes"
    # This runs at :00, :10, :20, :30, :40, :50 past every hour
    - cron: '*/10 * * * *'
  
  # Allows manual triggering from the Actions tab
  # Useful for testing without waiting for the schedule
  workflow_dispatch:

# Define our two monitoring jobs
# They run in parallel to save time
jobs:
  ping-python-api:
    name: Ping Python API
    runs-on: ubuntu-latest
    
    steps:
      - name: Health Check Python API
        run: |
          echo "🐍 Pinging Seamount Python API..."
          echo "Timestamp: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo "Target: https://seamount-api.onrender.com/api/v1/health"
          echo ""
          
          # Make the HTTP request and capture both response and status code
          # -s = silent mode (no progress bar)
          # -w = write out format string (we use it to get HTTP status)
          # The response body comes first, then we append the HTTP code on a new line
          response=$(curl -s -w "\n%{http_code}" https://seamount-api.onrender.com/api/v1/health)
          
          # Split the response into body and status code
          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | head -n -1)
          
          echo "📊 Response Status: $http_code"
          echo "📄 Response Body:"
          echo "$body" | head -c 500  # Show first 500 chars of response
          echo ""
          
          # Check if the response contains our health keyword
          if echo "$body" | grep -q "healthy"; then
            echo "✅ Python API is healthy! Keyword 'healthy' found in response."
          else
            echo "⚠️  Warning: 'healthy' keyword not found in response body."
          fi
          
          # Verify HTTP status code is in the 2xx success range
          if [ "$http_code" -ge 200 ] && [ "$http_code" -lt 300 ]; then
            echo "✅ HTTP status code indicates success."
            echo "🎯 Python API ping completed successfully!"
            exit 0
          else
            echo "⚠️  Python API returned non-2xx status: $http_code"
            echo "This might indicate the service is starting up or experiencing issues."
            # Still exit 0 because our goal is just to wake it up
            # We don't want the workflow to fail if Render is spinning up
            exit 0
          fi

  ping-wdk-service:
    name: Ping WDK Service  
    runs-on: ubuntu-latest
    
    steps:
      - name: Health Check WDK Service
        run: |
          echo "⚡ Pinging Seamount WDK Service..."
          echo "Timestamp: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo "Target: https://seamount-wdk.onrender.com/health"
          echo ""
          
          # Make the HTTP request and capture both response and status code
          response=$(curl -s -w "\n%{http_code}" https://seamount-wdk.onrender.com/health)
          
          # Split the response into body and status code
          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | head -n -1)
          
          echo "📊 Response Status: $http_code"
          echo "📄 Response Body:"
          echo "$body" | head -c 500  # Show first 500 chars
          echo ""
          
          # Check if the response contains our health keyword
          if echo "$body" | grep -q "healthy"; then
            echo "✅ WDK Service is healthy! Keyword 'healthy' found in response."
          else
            echo "⚠️  Warning: 'healthy' keyword not found in response body."
          fi
          
          # Check for chains array in response as additional validation
          if echo "$body" | grep -q "chains"; then
            echo "✅ Chains configuration detected in response."
          fi
          
          # Verify HTTP status code
          if [ "$http_code" -ge 200 ] && [ "$http_code" -lt 300 ]; then
            echo "✅ HTTP status code indicates success."
            echo "🎯 WDK Service ping completed successfully!"
            exit 0
          else
            echo "⚠️  WDK Service returned non-2xx status: $http_code"
            echo "This might indicate the service is starting up or experiencing issues."
            exit 0
          fi
```

#### Committing the Workflow

At the top of the file editor, change the filename from `main.yml` to `keep-warm.yml`. This makes the purpose of the workflow immediately clear when you look at your workflows list.

In the "Commit changes" dialog box that appears when you click the green "Commit changes" button, write a descriptive commit message. I suggest: 
```
Add automated health monitoring for Render services

- Pings Python API every 10 minutes
- Pings WDK service every 10 minutes  
- Prevents Render free tier from spinning down services
- Provides redundant monitoring alongside UptimeRobot
```

Select "Commit directly to the main branch" unless you have a specific branching strategy that requires pull requests for infrastructure changes. Click "Commit changes".

#### Testing Your Workflow Immediately

The moment you commit the workflow file, GitHub Actions detects it and adds it to your available workflows. Navigate back to the "Actions" tab. You should now see "Keep Render Services Warm" listed under "All workflows" in the left sidebar.

Click on "Keep Render Services Warm" to see its detail page. On the right side, you'll see a button that says "Run workflow". Click it. A small dialog appears asking which branch to run on—keep "main" selected and click the green "Run workflow" button.

Within ten to fifteen seconds, a new workflow run appears in the runs list. Click on it to watch it execute in real-time. You'll see two jobs running in parallel: "Ping Python API" and "Ping WDK Service". Each job takes about thirty to sixty seconds to complete.

Click on either job name to expand it and see the detailed logs. You should see the colorful emoji-marked output showing the timestamp, the target URL being pinged, the HTTP response code, and confirmation that the "healthy" keyword was found in the response. Both jobs should complete with green checkmarks.

#### Understanding the Workflow Execution

The schedule in your workflow uses cron syntax, which runs on UTC time regardless of your local timezone. The pattern `*/10 * * * *` means the workflow triggers at these UTC times every hour: 00, 10, 20, 30, 40, 50 minutes past the hour.

If you're in a different timezone, the workflow will still run every ten minutes, but the clock times you see in the logs will be in UTC. For example, if you're in Lagos (WAT, UTC+1), when your workflow runs at 13:00 UTC, your local time is 14:00.

The two jobs run in parallel, which is more efficient than sequential execution. This means both your Python API and WDK service get pinged simultaneously, and the entire workflow completes in about forty-five seconds instead of ninety seconds.

### Part 3: Setting Up Email Notifications

Both monitoring systems send you alerts, but let's make sure you're getting them reliably.

#### UptimeRobot Email Alerts

UptimeRobot sends emails immediately when a monitor goes down and again when it comes back up. The emails look like this:

**Subject**: `Monitor Down: Seamount Python API (FastAPI Backend)`

They include the exact time of failure, what error occurred (timeout, HTTP 500, connection refused, etc.), and how long the service has been down. Check your spam folder once after setting up to make sure these emails aren't being filtered.

You can also add SMS alerts on UptimeRobot's paid plan, but email should be sufficient for your current stage.

#### GitHub Actions Notifications

By default, GitHub only emails you about workflow failures if you're watching the repository. Let's make sure you get those notifications:

Click your profile picture in the top-right corner of GitHub and go to **Settings**. In the left sidebar, click **Notifications**. Scroll down to the **Actions** section. Make sure "Send notifications for failed workflows" is checked.

You'll receive an email if either the Python API or WDK service health check fails. The email includes a link directly to the failed workflow run so you can see the detailed logs immediately.

## Part 4: Verification and Monitoring Dashboard (5 Minutes)

Now let's verify everything is working perfectly together.

### Checking UptimeRobot Dashboard

Open your UptimeRobot dashboard in a browser tab you can keep open. Within five minutes of creating your monitors, you should see "Last Checked" timestamps updating. The response time graph starts populating with data points.

If you see red "Down" indicators, don't panic. Click on the monitor to see the error. Common first-time issues include Render services being asleep and taking sixty seconds to wake up (which exceeds your thirty-second timeout on the very first ping). UptimeRobot will mark it down initially, but on the next ping five minutes later, your service should be warm and respond quickly.

Watch the dashboard for fifteen minutes. You should see at least three successful pings for each service, and the response times should stabilize. Your Python API might show 200-500ms response times, and your WDK service should show 100-300ms.

### Checking GitHub Actions Dashboard

In your GitHub repository, go to the Actions tab and click "Keep Render Services Warm". You should see workflow runs appearing automatically every ten minutes. Each run should complete successfully in under one minute with green checkmarks for both jobs.

Click on a recent workflow run and expand both job logs. Verify that you see the "healthy" keyword found confirmation and the successful completion messages.

### Checking Your Render Dashboard

This is the ultimate confirmation. Log into your Render dashboard and navigate to each of your two services.

For each service, look at the **Events** section (usually in a tab or expandable section). You should no longer see "Service sleeping due to inactivity" events after you started monitoring. Instead, you'll see constant activity every few minutes as the health checks arrive.

Check the **Metrics** graphs for both services. The CPU usage and memory should show consistent small spikes every five to ten minutes. This is the heartbeat pattern we want—your services never idle long enough to spin down.

### The Combined Monitoring Pattern

Look at the timing of your pings. UptimeRobot pings every five minutes (at 0, 5, 10, 15, 20, etc. minutes past each hour). GitHub Actions pings every ten minutes (at 0, 10, 20, 30, etc.). This creates a beautiful overlapping pattern where your services receive pings like this:
```
Minute 0:  UptimeRobot + GitHub Actions (both ping)
Minute 5:  UptimeRobot only
Minute 10: UptimeRobot + GitHub Actions (both ping)
Minute 15: UptimeRobot only
Minute 20: UptimeRobot + GitHub Actions (both ping)
