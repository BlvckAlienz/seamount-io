name: Keep Render Services Warm

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping-python-api:
    name: Ping Python API
    runs-on: ubuntu-latest
    steps:
      - name: Health Check Python API
        run: |
          echo "🐍 Pinging Seamount Python API..."
          curl -f https://seamount-api.onrender.com/api/v1/health || echo "Failed but continuing"

  ping-wdk-service:
    name: Ping WDK Service
    runs-on: ubuntu-latest
    steps:
      - name: Health Check WDK Service
        run: |
          echo "⚡ Pinging Seamount WDK Service..."
          curl -f https://seamount-wdk.onrender.com/health || echo "Failed but continuing"
